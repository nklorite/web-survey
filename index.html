<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Survey</title>
</head>
<body>
    <header>
        <h1>Welcome to the Survey</h1>
    </header>

    <main>
        <div id="user-data-container">
            <h2>Enter your data</h2>
            
            <div id="user-data-form">
                <input type="text" id="name" placeholder="Name">
                <input type="number" id="age" placeholder="Age">
                <input type="email" id="email" placeholder="Email">

                <button class="submit-button" 
                id="submit-user-data-button">Submit</button>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2026 Survey by nklorite</p>
    </footer>

    <script src="scripts/submit-user-data-button.js" type="module"></script>
    <script src="scripts/storage.js" type="module"></script>
</body>
</html>
